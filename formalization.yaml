version: "v0.4"

project:
  name: "hadamard-formal: eight Hadamard orders unrecorded in the Cati-Pasechnik database, and the Miyamoto-erratum obstruction"
  description: >-
    A Lean 4 formalization of the periodic Cooper-Wallis construction and of
    Hadamard existence at eight orders: from kernel-checked periodic T-matrix
    quadruples of orders 103 and 163 and seven symmetric-circulant Williamson
    quadruples, the development proves that Hadamard matrices of orders 2884,
    4532, 7004, 7172, 7828, 8476, 9476, and 11948 exist. Each of the eight
    orders lands on an entry of Table 4 of Cati and Pasechnik's maintained
    construction database (arXiv:2411.18897v2, 2025-08-30) recording no
    Hadamard matrix of that order as known, and the source repositories'
    firsthand audit of the construction literature (closed 2026-08-29)
    located no published route to the order-103 or order-163 T-objects the
    eight are built from. The development also proves the erratum core of the
    companion Hadamard-M note on Miyamoto's 1991 construction paper: the
    handshake parity obstruction, its empty-class corollary, and the
    nonexistence of the displayed C2-matrix ingredient of that paper's
    Corollary 4 at every positive block order not congruent to 1 mod 4 -
    covering the paper's printed list entries at orders 103, 127, and 151
    under both printed readings of the corollary's output order, and leaving
    the order-515 list entry, the paper's claim of a Hadamard matrix of order
    2060, unsupported by the paper's own machinery. Cati and Pasechnik, for
    want of details, record being unable to verify the constructions claimed
    in that paper's section 7, naming order 4*515 as their example; the
    obstruction supplies an independent mathematical reason the printed route
    cannot deliver that entry. Order 2060 itself is not open: a Hadamard
    matrix of that order was posted publicly on 2026-08-23, credited to
    Schneider, by other means.
  authors:
    - "JD Jones"
  license: "MIT"
  responsible_maintainers:
    - "JD Jones"

classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "05B20"

sources:
  - title: "Hadamard-T: T-matrix witnesses and the Hadamard orders they close"
    authors:
      - "JD Jones"
    id: "https://github.com/JD-Jones-ASES/Hadamard-T/tree/eec1bed6216c44675d946fe80d47695a7ae2ab40"
    type: "other"
    location: "note/NOTE.md sections 1, 2, 4, 5, 6.1 and 7; data/T103.json, data/T163.json, data/williamson-quadruples.json, data/williamson-13.json"
    relationship: "formalizes"
    note: >-
      Presents the periodic T-matrix and Williamson definitions, the
      Cooper-Wallis composite, and the exact witness data pinned by this
      repository's exporter, together with the eight first-tranche order
      calculations. It records, with dates and a machine-diffed
      transcription, the Table-4 status of the eight output orders, and its
      firsthand prior-art audit (closed 2026-08-29) located no published
      route to the order-103 or order-163 T-objects.
    author_endorsement: "participated"
  - title: "Hadamard-M: an erratum at order 515, and an explicit Hadamard matrix of order 7796"
    authors:
      - "JD Jones"
    id: "https://github.com/JD-Jones-ASES/Hadamard-M/tree/0208cf661fcd6b1e7d69eb52078d873eefc4d7cf"
    type: "other"
    location: "note/NOTE.md sections 2.1 and 2.3-2.7, Propositions 2-4"
    relationship: "formalizes"
    note: >-
      Source of the handshake obstruction (its Proposition 3) and of its
      application: its Proposition 2 shows that any instance of Miyamoto
      1991's Corollary 4 forces a matrix in the obstructed class at the
      corollary's block order, which is the erratum formalized here as the
      parity theorem, its empty-class corollary, and the C2-display
      nonexistence theorem. The transcription premises about the printed
      text of the 1991 paper - the displayed form, hypothesis (4.1), and the
      section-7 lists - remain human-audited in that note, which quotes the
      load-bearing printed sentence verbatim.
    author_endorsement: "participated"
  - title: "A construction of Hadamard matrices"
    authors:
      - "M. Miyamoto"
    id: "J. Combin. Theory Ser. A 57 (1991) 86-108"
    type: "paper"
    location: "https://doi.org/10.1016/0097-3165(91)90008-5"
    relationship: "background"
    note: >-
      The paper the source erratum corrects. Its Corollary 4 is the paper's
      only engine reaching odd part congruent to 3 mod 4; its section-7
      lists carry the order-103 and order-515 entries that the obstruction
      leaves unsupported. Its Theorem 5 / Corollary 1 is untouched by the
      erratum.
  - title: "A database of constructions of Hadamard matrices"
    authors:
      - "M. Cati"
      - "D. V. Pasechnik"
    id: "arXiv:2411.18897"
    type: "paper"
    location: "Table 4; the section-6 note on the unverified Miyamoto section-7 claims"
    relationship: "background"
    note: >-
      The maintained construction database for Hadamard matrices, updating
      Seberry and Yamada's Table A.17. Table 4 of v2 (2025-08-30; the source
      repository re-confirmed on 2026-08-30 that v2 remains the current
      version) lists all eight formalized orders as not recorded known -
      entries 721(3), 1133(3), 1751(3), 1793(4), 1957(3), 2119(4), 2369(3),
      and 2987(3). For want of details, its authors record being unable to
      verify the constructions claimed in Miyamoto's section 7, naming order
      4*515 as their example.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.33.0/Mathlib/LinearAlgebra/Matrix/HadamardMatrix.lean"
    relationship: "builds-on"
    note: >-
      Mathlib's Hadamard-matrix module (added 2026-06-16, mathlib4 PR
      #38582) supplies the Matrix.IsHadamard predicate the compared
      statements use, closure lemmas including the Kronecker product, and
      the 4-divides-n obstruction. It exhibits no Hadamard matrix of any
      order and contains no existence theorem, and Mathlib at this revision
      has no content on Williamson quadruples, T-matrices, or the
      Goethals-Seidel and Cooper-Wallis constructions.
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/abe6ef73129989fb8cf94edb72b1ac21d30a411b/FormalConjectures/Wikipedia/Hadamard.lean"
    relationship: "other"
    note: >-
      States the Hadamard conjecture and its known-for-4k-with-k-at-most-166
      variant in Lean as unproved benchmark targets; as of that commit,
      every Hadamard statement there, including an explicit order-12 matrix,
      is left as sorry. No proved content overlaps this development.
  - id: "Lu-Ming Zhang, Formal Verification of Constructions and Theorems on Hadamard Matrices, MSc dissertation, University of Oxford, 2021"
    relationship: "other"
    note: >-
      The one prior proof-assistant effort on Hadamard constructions our
      search located, known to us only through Cati and Pasechnik's citation
      describing it as work towards verifying constructions covering orders
      up to 112. We could not locate its text, artifact, or even the proof
      assistant used, so it cannot be independently confirmed; its stated
      order range is disjoint from the eight orders proved here, though it
      plausibly includes Williamson- and Goethals-Seidel-type constructions
      at small orders.

status:
  scope: >-
    The compared surface consists of the handshake parity theorem, its
    empty-class corollary, the nonexistence theorem for the displayed
    C2-matrix of Miyamoto's Corollary 4, a generic periodic Cooper-Wallis
    existence theorem, and eight existence theorems at orders 2884, 4532,
    7004, 7172, 7828, 8476, 9476, and 11948. The order-103 and order-163
    predicates are periodic autocorrelation; no aperiodic T-sequence
    statement is made. The development proves existence without
    materializing the eight large matrices, and it formalizes neither the
    source repositories' Python certificates and search history nor the
    erratum's transcription premises about the printed 1991 text, which
    remain human-audited in Hadamard-M. Deliberate proof holes occur only in
    Challenge.lean and are excluded from the solution axiom audit.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "HadamardFormal.handshake_mod_four"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "HadamardFormal.no_handshake_matrix"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
