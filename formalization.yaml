automation:
  methods:
    - method: "agent"
      models:
        - "Claude Code (Fable 5)"
        - "Codex (GPT 5.6 Sol)"
        - "GPT 5.6 (external source review)"
        - "Grok (external review; exact model not recorded)"
      framework: "mixed AI-agent workflow"
      tool_setup: >-
        Fable produced the source mathematical repositories and this
        revision of the registry metadata; GPT 5.6 and Grok supplied
        external source reviews; Codex built the Lean formalization and
        Palomar package, and Fable added the empty-class corollary and the
        C2-display nonexistence theorem. Exact-data import is guarded by
        SHA-256 pins and a deterministic exporter, concrete predicates are
        checked by kernel reduction, symbolic constructions are proved in
        Lean, and the public proof closure is checked with
        Lean.collectAxioms.
      prompting_notes: >-
        The Lean build followed the repository's source-controlled pour
        plan, with the public challenge restricted to the theorem statements
        and definitions needed for the handshake, erratum-application, and
        Cooper-Wallis results.
  spend_usd: "not tracked"
  notes: >-
    AI systems generated and audited the mathematics and code; JD Jones
    directed the work and is the responsible author and maintainer. AI
    assistance is disclosed at the project level and in both source
    repositories.

fidelity:
  divergences: >-
    The formalization uses the periodic T-matrix predicate required by the
    Cooper-Wallis construction, not the stronger aperiodic T-sequence
    notion, and it proves existence without materializing the resulting
    large matrices. On the erratum, the displayed C2 form, the pairing
    consequence of the paper's hypothesis (4.1), and the emptiness of the
    class at every positive block order not congruent to 1 mod 4 are
    formalized, which closes both printed readings of the corollary's
    output order; what remains informal is the transcription of the printed
    text, human-audited in Hadamard-M, and the bibliographic propagation
    from the unsupported order-103 entry to the order-515 list entry and
    its order-2060 claim.

review:
  status: "self-assessed"
  reviewers:
    - "JD Jones"
  notes: >-
    The Lean kernel checks all solution proofs and concrete certificates,
    and the build-time axiom audit permits only propext, Classical.choice,
    and Quot.sound. The source mathematics received external AI review; no
    independent human expert review is recorded. Kernel replay, Comparator
    statement matching, and the axiom audit establish proof replay and
    statement fidelity, not literature status; the dated status facts above
    are documentary claims resting on the cited public sources.

alignment:
  namespace: "HadamardFormal"
  statements:
    - source: "Hadamard-M, note section 2.5, Proposition 3"
      lean: "HadamardFormal.handshake_mod_four"
      module: "Solution"
      status: "proved"
      note: >-
        The parity obstruction, for odd orders. Any instance of Miyamoto
        1991's Corollary 4 forces a matrix in this class at the corollary's
        block order (source note, Proposition 2).
    - source: "Hadamard-M, note sections 2.5-2.6, Propositions 3-4"
      lean: "HadamardFormal.no_handshake_matrix"
      module: "Solution"
      status: "proved"
      note: >-
        The obstructed class is empty at every positive order not congruent
        to 1 mod 4 - for odd orders by the obstruction, for even orders by
        row parity.
    - source: "Hadamard-M, note sections 2.1 and 2.4, the displayed form and Proposition 2"
      lean: "HadamardFormal.no_c2_matrix"
      module: "Solution"
      status: "proved"
      note: >-
        States the displayed C2 form directly and proves it has no instance
        at any positive block order not congruent to 1 mod 4: the pairing
        condition of hypothesis (4.1) forces the interior block D1 into the
        obstructed class. Covers m = 51, 63, 75 - the paper's printed
        entries at orders 103, 127, 151 - and m = 50, the printed 4(2m+3)
        reading of the output order.
    - source: "Hadamard-T note, section 2, periodic Cooper-Wallis composite"
      lean: "HadamardFormal.cooperWallis"
      module: "Solution"
      status: "proved"
      note: "Uses the source orientation for periodic autocorrelation and yields order 4tw."
    - source: "Hadamard-T note, section 6.1, T163 with Williamson order 11"
      lean: "HadamardFormal.hadamard_7172"
      module: "Solution"
      status: "proved"
      note: "Table 4 entry 1793(4): order 7172 not recorded known."
